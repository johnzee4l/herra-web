/* ---------- Users ---------- */
function UsersAdmin(){const[q,setQ]=useState('');const[pg,setPg]=useState(0);const us=S.db.users.filter(u=>(u.name+u.email).toLowerCase().includes(q.toLowerCase()));const pages=Math.max(1,Math.ceil(us.length/10));
  const setRole=(u,r)=>{if(u.id===meId()&&r!=='admin'){toast("You can't demote yourself",{icon:'Prohibit',tone:'risk'});return}confirmDlg({title:`Make ${u.name} ${r==='admin'?'an admin':'a farmer'}?`,body:r==='admin'?'Admins can see every space, entry and audit record.':'They lose all admin access immediately.',confirm:'Change role',tone:'primary',icon:'Users',onOk:()=>{u.role=r;audit('change_role','user',u.id,r);emit();toast(u.name+' is now '+r,{icon:'Users'})}})};
 return html`<${AdminPage} title="Users" sub=${`${S.db.users.length} accounts`} ><div class="input-group" style="max-width:320px;margin-bottom:16px"><${Ic} n="MagnifyingGlass" s=18/><input placeholder="Search name or email" value=${q} onInput=${e=>{setQ(e.target.value);setPg(0)}}/></div><${Table} cols=${[{h:'User',r:u=>html`<div class="row g3"><${Avatar} u=${u} sz="sm"/><div><b>${u.name}</b><div class="caption">${u.email}</div></div></div>`},{h:'Role',r:u=>html`<div style="width:130px"><${Sel} v=${u.role} on=${v=>v!==u.role&&setRole(u,v)} opts=${[{k:'farmer',l:'Farmer'},{k:'admin',l:'Admin'}]}/></div>`},{h:'Spaces',num:1,r:u=>S.db.members.filter(m=>m.userId===u.id).length},{h:'Status',r:u=>html`<${Badge} tone=${u.status==='invited'?'heat':'growth'}>${cap(u.status)}<//>`},{h:'Last active',r:u=>u.active?ago(u.active):'—'},{h:'',num:1,r:u=>u.role==='farmer'?html`<button class="btn sm ghost" onClick=${()=>go('/admin/spectate/'+u.id)}><${Ic} n="Eye" s=16/>Spectate</button>`:''}]} rows=${us.slice(pg*10,pg*10+10)}/><${Paginate} page=${pg} pages=${pages} on=${setPg}/><//>`}

/* ---------- Audit ---------- */
function AuditLog(){const[fa,setFa]=useState('all'),[fact,setFact]=useState('all'),[ft,setFt]=useState('all');const[pg,setPg]=useState(0);
 const actors=['all',...new Set(S.db.audit.map(a=>a.actor))],acts=['all',...new Set(S.db.audit.map(a=>a.action))],types=['all',...new Set(S.db.audit.map(a=>a.type))];
 const A=S.db.audit.filter(a=>(fa==='all'||a.actor===fa)&&(fact==='all'||a.action===fact)&&(ft==='all'||a.type===ft));const pages=Math.max(1,Math.ceil(A.length/12));
 const ic={create_space:'PenNib',promote_model:'Medal',rollback_model:'ArrowCounterClockwise',shadow_model:'Eye',rotate_code:'ArrowsClockwise',revoke_code:'Prohibit',spectate:'Eye',review_outcome:'ShieldCheck',broadcast:'Megaphone',update_crop_thresholds:'Plant',update_rule:'ListChecks',update_weights:'Sliders',update_role:'Users',join_space:'Key'};
 const nm=id=>id==='all'?'All':(getUser(id)||{name:id}).name;
 return html`<${AdminPage} title="Audit log" sub="Every admin and privileged action, newest first. Insert-only."><div class="row g4 wrap" style="margin-bottom:16px"><div style="min-width:180px"><${Sel} v=${fa} on=${v=>{setFa(v);setPg(0)}} opts=${actors.map(k=>({k,l:nm(k)}))}/></div><div style="min-width:200px"><${Sel} v=${fact} on=${v=>{setFact(v);setPg(0)}} opts=${acts.map(k=>({k,l:k==='all'?'All actions':k.replace(/_/g,' ')}))}/></div><div style="min-width:160px"><${Sel} v=${ft} on=${v=>{setFt(v);setPg(0)}} opts=${types.map(k=>({k,l:k==='all'?'All targets':k}))}/></div></div><${Table} cols=${[{h:'When',r:a=>html`<div><div style="font-weight:600">${ago(a.ts)}</div><div class="caption">${fDT(a.ts)}</div></div>`},{h:'Actor',r:a=>html`<span class="row g2"><${Avatar} u=${getUser(a.actor)} sz="sm"/>${(getUser(a.actor)||{name:'—'}).name}</span>`},{h:'Action',r:a=>html`<span class="row g2"><${Ic} n=${ic[a.action]||'Lightning'} w="duotone" s=20 c="var(--primary)"/><b>${a.action.replace(/_/g,' ')}</b></span>`},{h:'Target',r:a=>html`<span class="mono" style="font-size:12px">${a.type}:${String(a.target).slice(0,22)}</span>`},{h:'Detail',r:a=>html`<span class="caption">${a.meta}</span>`}]} rows=${A.slice(pg*12,pg*12+12)}/><${Paginate} page=${pg} pages=${pages} on=${setPg}/><//>`}

/* ---------- Tools ---------- */


/* ================= Root app & mockup stage ================= */
const BPS=[['sm',480],['md',768],['lg',1024],['xl',1280],['2xl',1600]];
const isMobileReal=()=>innerWidth<720;
function demo(role,path){const u=getUser(role==='admin'?'u_aileen':'u_rodel');if(!S.session.authed||S.session.role!==role){S.session={authed:true,role,email:u.email,name:u.name,uid:u.id}}S.cur.spaceId='sp_vic';S.hist=[];emit();go(path);S.ui.ov=[];emit()}
function Forbidden(){return html`<div class="fill center"><${Empty} icon="LockKey" title="Admin access required" sub="Your account is a farmer account. Switch role from the mockup bar or sign in as an admin." action="Go to farmer app" onAction=${()=>go('/farmer')}/></div>`}
function AppRoot(){const s=useS();const ref=useRef();const[bpl,setBpl]=useState('');const st=s.settings;
 useEffect(()=>{const el=ref.current;if(!el)return;const f=()=>{const w=el.clientWidth;let cl=[],mx='xs';BPS.forEach(([k,v])=>{if(w>=v){cl.push('bp-'+k);mx=k}});setBpl(cl.join(' '));if(S.bp!==mx){S.bp=mx;emit()}};f();const ro=new ResizeObserver(f);ro.observe(el);return()=>ro.disconnect()},[s.device,s.session.role]);
 const p=s.route.path,a=s.session.authed,role=s.session.role;
 useEffect(()=>{const pub=['/sign-in','/sign-up','/forgot-password'].includes(p)||p.startsWith('/join');
  if(p==='/'||p===''){go(a?(role==='admin'?'/admin':(mySpaces(meId()).length?'/farmer':'/onboarding')):'/sign-in',{replace:true});return}
  if(!a&&!pub){go('/sign-in',{replace:true});return}if(a&&pub&&!p.startsWith('/join')){go(role==='admin'?'/admin':'/farmer',{replace:true});return}
  if(a&&role==='admin'&&p.startsWith('/farmer'))go('/admin',{replace:true})},[p,a,role]);
 let view=null;if(p==='/sign-in')view=html`<${SignIn}/>`;else if(p==='/sign-up')view=html`<${SignUp}/>`;else if(p==='/forgot-password')view=html`<${Forgot}/>`;else if(p.startsWith('/join'))view=html`<${JoinPage} code=${p.split('/')[2]||''} key=${p}/>`;else if(p==='/onboarding')view=html`<${Onboarding}/>`;
 else if(p.startsWith('/farmer')&&a&&role==='farmer')view=html`<${FarmerApp} sub=${p.slice(7)||'/'}/>`;else if(p.startsWith('/admin')&&a)view=role==='admin'?html`<${AdminApp} sub=${p.slice(6)||'/'}/>`:html`<${Forbidden}/>`;
 return html`<div ref=${ref} class=${cx('app',bpl,st.density==='compact'&&'compact',st.motion==='reduced'&&'reduce-motion')}>${view}${s.ui.syncing&&html`<div class="offline-chip" style="background:var(--sky-tint);color:var(--sky);border-color:var(--sky)"><${Ic} n="ArrowsClockwise" w="bold" s=15 cls="sync-spin"/>Syncing drafts…</div>`}<${Overlays}/><${Toasts}/></div>`}

const DEV={phone:[390,844,11],tablet:[1040,740,14]};
function Clock(){const[,u]=useReducer(x=>x+1,0);useEffect(()=>{const i=setInterval(u,15000);return()=>clearInterval(i)},[]);return fTime(NOW())}
function StatusBar(){return html`<div class="statusbar"><span><${Clock}/></span><span class="sb-r"><${Ic} n="CellSignalFull" w="fill" s=17/><${Ic} n="WifiHigh" w="bold" s=17/><${Ic} n="BatteryFull" w="fill" s=22/></span></div>`}
function StageBar(){const s=useS();const role=s.session.role||'farmer';const eff=effDevice(s);
 const guide=[['Sparkle','Run a Recommend on Riverside Plot','farmer','/farmer/analyze?field=f_river&kind=recommend'],['Heartbeat','Check-up on Maligaya rice','farmer','/farmer/analyze?field=f_maligaya&kind=checkup'],['PenNib','Draw a new field on the map','farmer','/farmer/fields/new'],['Key','Join a space with HRA-7K2Q-9M4D','farmer','/farmer/spaces?join=1'],['ShieldSlash','Open the abstained entry (Lakeside)','farmer','/farmer/entries'],['Cpu','Promote the candidate through the gate','admin','/admin/models/hi-xgb-20261103-4c9e1a7f'],['Flag','Review an outcome','admin','/admin/outcomes'],['Megaphone','Broadcast to Victoria farmers','admin','/admin/spaces/sp_vic/announcements'],['Eye','Spectate Rodel read-only','admin','/admin/spectate/u_rodel']];
 return html`<div class="stage-bar"><div class="stage-brand"><${Logo} s=28/><span class="hide-sm">Herra AI <span class="muted" style="font-weight:500">· interactive mockup · blueprint v1.2</span></span></div><div class="grow"></div>
  <${Seg} sm cls="neutral" opts=${[{k:'farmer',l:'Farmer',i:'Plant'},{k:'admin',l:'Admin',i:'Stack'}]} v=${role} on=${r=>demo(r,r==='admin'?'/admin':'/farmer')}/>
  <${Seg} sm cls="neutral" opts=${[{k:'phone',l:'Phone',i:'DeviceMobile'},{k:'tablet',l:'Tablet',i:'DeviceTablet'},{k:'desktop',l:'Desktop',i:'Desktop'}]} v=${eff} on=${k=>{S.device=k;emit()}}/>
  
  <${ThemeBtn}/>
  <${Pop} btn=${tg=>html`<button class="chip sm" onClick=${tg}><${Ic} n="Lightbulb" s=15 w="fill"/><span class="hide-sm">Try this</span></button>`} align="right"><div class="mlabel label">Demo scenarios</div>${guide.map(([ic,l,r,to])=>html`<button onClick=${()=>{demo(r,to.replace('?join=1',''));if(to.includes('join=1'))setTimeout(()=>openSheet(JoinSheet,{},{title:'Join a space'}),400)}}><${Ic} n=${ic} w="duotone" s=18 c=${r==='admin'?'var(--sky)':'var(--primary)'}/><span style="white-space:normal;text-align:left;font-size:13px">${l}</span></button>`)}<hr/><button class="danger" onClick=${()=>{resetDemo();signOut();toast('Demo data reset',{icon:'ArrowCounterClockwise',tone:'sky'})}}><${Ic} n="ArrowCounterClockwise" s=18/>Reset demo data</button><//></div>`}
const effDevice=s=>s.session.role==='admin'&&s.device==='phone'?'desktop':s.device;
function Stage(){const s=useS();const[vp,setVp]=useState([innerWidth,innerHeight]);useEffect(()=>{const f=()=>setVp([innerWidth,innerHeight]);addEventListener('resize',f);return()=>removeEventListener('resize',f)},[]);
 const mob=vp[0]<720;const dev=effDevice(s);const theme=s.settings.theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):s.settings.theme;
 useEffect(()=>{document.documentElement.dataset.theme=theme;document.documentElement.style.setProperty('--glow',`color-mix(in oklab,var(--primary) ${Math.round(s.settings.accent*.2)}%,transparent)`)},[theme,s.settings.accent]);
 useEffect(()=>{document.body.classList.toggle('mobile-real',mob)},[mob]);
 if(mob)return html`<div class="stage mobile-real" style="background:var(--background)"><div style="position:absolute;inset:0"><${AppRoot}/></div></div>`;
 const availH=vp[1]-52-20,availW=vp[0]-20;
 if(dev==='desktop')return html`<div class="stage"><${StageBar}/><div class="stage-body full"><div class="browser"><div class="browser-top"><div class="traffic"><i></i><i></i><i></i></div><div class="urlbar"><${Ic} n="LockSimple" w="fill" s=13/><span>herra.app<b>${s.route.path==='/'?'':s.route.path}</b></span></div><span style="width:50px"></span></div><div class="screen-d" style="transform:translateZ(0)"><${AppRoot}/></div></div></div></div>`;
 const[w,hh,pad]=DEV[dev];const fw=w+pad*2,fh=hh+pad*2,sc=Math.min(1,availH/fh,availW/fw);
 return html`<div class="stage"><${StageBar}/><div class="stage-body"><div class="frame-wrap" style=${{width:fw*sc+'px',height:fh*sc+'px',marginTop:'10px'}}><div style=${{width:fw+'px',height:fh+'px',transform:`scale(${sc})`,transformOrigin:'top left'}}><div class=${'phone'+(dev==='tablet'?' tablet':'')} style=${{width:fw+'px',height:fh+'px'}}><div class="screen" style=${{width:w+'px',height:hh+'px'}}><${StatusBar}/>${dev==='phone'&&html`<div class="island"></div>`}<${AppRoot}/>${dev==='phone'&&html`<div class="homebar"></div>`}</div></div></div></div></div></div>`}
function StageFab(){const s=useS();return html`<${Pop} btn=${tg=>html`<button class="stagefab" onClick=${tg} aria-label="Mockup controls"><${Ic} n="Faders" s=18/></button>`} align="right"><div class="mlabel label">Mockup</div><button onClick=${()=>demo('farmer','/farmer')}><${Ic} n="Plant" s=18/>Farmer app</button><button onClick=${()=>demo('admin','/admin')}><${Ic} n="Stack" s=18/>Admin console</button><button onClick=${toggleTheme}><${Ic} n="Moon" s=18/>Toggle theme</button><button class="danger" onClick=${()=>{resetDemo();signOut()}}><${Ic} n="ArrowCounterClockwise" s=18/>Reset demo</button><//>`}
/* boot */
render(html`<${Stage}/>`,document.getElementById('root'));


</script>
</body>
</html>
